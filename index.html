<!DOCTYPE html>
<html lang="pt-br" class="light">
 
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Pokedex</title>
   
   <!--LINK CSS-->
   <link rel="stylesheet" href="style.css">
</head>
 
<body>

   <!--HEADER-->
   <header id="header">
      <button class="more_options_button" onclick="botao()">
         <ion-icon name="ellipsis-vertical-outline"></ion-icon>
      </button>

      <h1 class="title_pokedex">
         Pokedex
      </h1>

      <button class="mail_box_button" onclick="botao()">
         <ion-icon name="mail-outline"></ion-icon>
      </button>

      <button class="profile_button" onclick="botao()">
         <ion-icon name="person-circle-outline"></ion-icon>
      </button>
   </header>
   

   <!--NAVBAR-->
   <nav id="navbar">
      <button class="about_button" onclick="botao()">
         Sobre
      </button>

      <button class="home_button" onclick="botao()">
         Início
      </button>

      <button class="favorites_button" onclick="botao()">
         Favoritos
      </button>
   </nav>

   <!--MAIN-->
   <main id="main">
      <button class="searchbar" onclick="botao()">
         <h1 class="search_title">
            Pesquisar...
         </h1>

         <h1 class="search_icon">
            🔍
         </h1>
      </button>

      <!--SECTION-->
      <section id="section">
         <!--Cartas-->
         <article class="card">
            <header class="card_header">
               <p class="card_id">ID: TESTE</p>
               <button class="sword_button" aria-label="Comparar pokémon">
                  ⚔️
               </button>
               <button class="hearth_button" aria-label="Favoritar pokémon">
                  <ion-icon name="heart-outline"></ion-icon>   
               </button>
            </header>
            <main class="card_main">
               <img src="./assets/Pokemons/Pokemon_charmander.png" alt="charmander" class="card_img">
            </main>
            <footer class="card_footer">
               <p class="card_title">Name: TESTE</p>
            </footer>
         </article>
      </section>


   </main>

   <!--FOOTER-->
   <footer id="footer">
         <button class="github_button" onclick="botao()">
            <ion-icon name="logo-github"></ion-icon>
         </button>
            
         <button class="zap_button" onclick="botao()">
            <ion-icon name="logo-whatsapp"></ion-icon>
         </button>

         <button class="instagram_button" onclick="botao()">
            <ion-icon name="logo-instagram"></ion-icon>
         </button>
   </footer>

   <!--ICONS-->   
   <script type="module" src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.esm.js"></script>
   <script nomodule src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.js"></script>
   
   <!--LINK JAVA SCRIPT-->
   <script src="pokemons.js"></script>
   <script type="module" src="script.js"></script>
</body>
 
</html>
