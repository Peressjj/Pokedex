<!DOCTYPE html>
<html lang="pt-br" class="light">
 
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Pokedex</title>
   
   <!--LINK CSS-->
   <link rel="stylesheet" href="style.css">
</head>
 
<body>

   <!--HEADER-->
   <header id="header">
      <button class="more_options_button">
         <ion-icon name="ellipsis-vertical-outline"></ion-icon>
      </button>

      <h1 class="title_pokedex">
         Pokedex
      </h1>

      <button class="mail_box_button">
         <ion-icon name="mail-outline"></ion-icon>
      </button>

      <button class="profile_button">
         <ion-icon name="person-circle-outline"></ion-icon>
      </button>
   </header>
   

   <!--NAVBAR-->
   <nav id="navbar">
      <button class="about_button">
         About
      </button>

      <button class="home_button">
         Home
      </button>

      <button class="favorites_button">
         Favorites
      </button>
   </nav>

   <!--MAIN-->
   <main id="main">
      <button class="searchbar">
         <h1 class="search_title">
            Search...
         </h1>

         <h1 class="search_icon">
            🔍
         </h1>
      </button>

      <!--SECTION-->
      <section id="section">
         <!--CARDS-->
         <article class="card_1">
            <header class="card_1_header">
               <h1 class="Bulbasaur">
                  Bulbasaur
               </h1>
               <button class="hearth_button1">
                  ❤️
               </button>
            </header>
         </article>

         <article class="card_2">
            <header class="card_2_header">
               <h1 class="Charmander">
                  Charmander
               </h1>
               <button class="hearth_button2">
                  ❤️
               </button>
            </header>
         </article>

         <article class="card_3">
            <header class="card_3_header">
               <h1 class="Squirtle">
                  Squirtle
               </h1>
               <button class="hearth_button3">
                  ❤️
               </button>
            </header>
         </article>

         <article class="card_4">
            <header class="card_4_header">
               <h1 class="Pikachu">
                  Pikachu
               </h1>
               <button class="hearth_button4">
                  ❤️
               </button>
            </header>
         </article>

         <article class="card_5">
            <header class="card_5_header">
               <h1 class="Jigglypuff">
                  Jigglypuff
               </h1>
               <button class="hearth_button5">
                  ❤️
               </button>
            </header>
         </article>

         <article class="card_6">
            <header class="card_6_header">
               <h1 class="Meowth">
                  Meowth
               </h1>
               <button class="hearth_button6">
                  ❤️
               </button>
            </header>
         </article>

         <article class="card_7">
            <header class="card_7_header">
               <h1 class="Psyduck">
                  Psyduck
               </h1>
               <button class="hearth_button7">
                  ❤️
               </button>
            </header>
         </article>

         <article class="card_8">
            <header class="card_8_header">
               <h1 class="Gengar">
                  Gengar
               </h1>
               <button class="hearth_button8">
                  ❤️
               </button>
            </header>
         </article>

         <section class="card_9">
            <header class="card_9_header">
               <h1 class="Magikarp">
                  Magikarp
               </h1>
               <button class="hearth_button9">
                  ❤️
               </button>
            </header>
         </section>

         <section class="card_10">
            <header class="card_10_header">
               <h1 class="Snorlax">
                  Snorlax
               </h1>
               <button class="hearth_button10">
                  ❤️
               </button>
            </header>
         </section>
      </section>
   </main>

   <!--FOOTER-->
   <footer id="footer">
         <button class="github_button">
            <ion-icon name="logo-github"></ion-icon>
         </button>
            
         <button class="zap_button">
            <ion-icon name="logo-whatsapp"></ion-icon>
         </button>

         <button class="instagram_button">
            <ion-icon name="logo-instagram"></ion-icon>
         </button>
   </footer>

   <!--ICONS-->   
   <script type="module" src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.esm.js"></script>
   <script nomodule src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.js"></script>
   
   <!--LINK JAVA SCRIPT-->
   <script src="script.js"></script>
</body>
 
</html>
