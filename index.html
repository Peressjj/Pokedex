<!DOCTYPE html>
<html lang="pt-br" class="light">
 
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Pokedex</title>
   <link rel="stylesheet" href="style.css">
</head>
 
<body>
   <header id="header">
      <button class="more_options_button" onclick="alert('Você clicou no botão!')">
         <ion-icon name="ellipsis-vertical-outline"></ion-icon>
      </button>

      <h1 class="title_pokedex">
         Pokedex
      </h1>

      <button class="mail_box_button" onclick="alert('Você clicou no botão!')">
         <ion-icon name="mail-outline"></ion-icon>
      </button>

      <button class="profile_button" onclick="alert('Você clicou no botão!')">
         <ion-icon name="person-circle-outline"></ion-icon>
      </button>
   </header>
   


   <nav id="navbar">
      <button class="about_button" onclick="alert('Você clicou no botão!')">
         Sobre
      </button>

      <button class="home_button" onclick="alert('Você clicou no botão!')">
         Início
      </button>

      <button class="favorites_button" onclick="alert('Você clicou no botão!')">
         Favoritos
      </button>
   </nav>



   <main id="main">
      <button class="searchbar" onclick="alert('Você clicou no botão!')">
         <h1 class="search_title">
            Pesquisar...
         </h1>

         <h1 class="search_icon">
            🔍
         </h1>
      </button>


      <section id="section">
         <article class="card">
            <header class="card_header">
               <p class="card_id">ID: TESTE</p>
               <button class="sword_button" aria-label="Comparar pokémon">
                  ⚔️
               </button>
               <button class="hearth_button" aria-label="Favoritar pokémon">
                  <ion-icon name="heart-outline"></ion-icon>   
               </button>
            </header>
            <main class="card_main">
               <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/shiny/4.png" alt="charmander" class="card_img">
            </main>
            <footer class="card_footer">
               <p class="card_title">TESTE</p>
            </footer>
         </article>
      </section>

      <button class="seemore_button" onclick="alert('Você clicou no botão!')">
         Ver mais
      </button>
   </main>



   <footer id="footer">
         <button class="github_button" onclick="alert('Você clicou no botão!')">
            <ion-icon name="logo-github"></ion-icon>
         </button>
            
         <button class="zap_button" onclick="alert('Você clicou no botão!')">
            <ion-icon name="logo-whatsapp"></ion-icon>
         </button>

         <button class="instagram_button" onclick="alert('Você clicou no botão!')">
            <ion-icon name="logo-instagram"></ion-icon>
         </button>
   </footer>

   
   <script type="module" src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.esm.js"></script>
   <script nomodule src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.js"></script>

   <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
   
   <script src="scriptpokemon.js"></script>
   <script type="module" src="script.js"></script>
</body>
 
</html>
