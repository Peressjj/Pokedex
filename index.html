<!DOCTYPE html>
<html lang="pt-br" class="light">
 
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Pokedex</title>
   <link rel="stylesheet" href="style.css">
</head>
 
<body>

   <header id="header"></header>

   <dialog class="popup"></dialog>

   <dialog id="detalhes"></dialog>

   <div class="duel">
      <div class="cima">
         <button class="voltar">X</button>
      </div>
      <div class="two_cards">
         <div class="mini_card">pokemon 1</div>
         <div class="mini_card">pokemons 2</div>
      </div>
      <div class="two_atributes">
         <div class="atribute"></div>
         <div class="atribute"></div>
      </div>
   </div>




   <main id="main">

      <div class="barra_busca">
         <div id="searchbar"></div>
         <button id="filter">Filtros</button>
      </div>
      

      <p id="sem_resultado" hidden>Nenhum Pokémon encontrado.</p>

      <section id="section"></section>


      <button class="seemore_button" id="ver_mais">Ver mais</button>
   </main>

   <footer id="footer"></footer>

   
   <script type="module" src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.esm.js"></script>
   <script nomodule src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.js"></script>

   <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
   
   <script src="scriptpokemon.js"></script>
   <script src="script.js"></script>
</body>
 
</html>
