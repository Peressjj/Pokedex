<!DOCTYPE html>
<html lang="pt-br" class="light">
 
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Pokedex</title>
   <link rel="stylesheet" href="style.css">
   <meta name="viewport"
      content="width=device-width, initial-scale=1.0"
</head>
 
<body>

   <header id="header"></header>
   
   <nav id="navbar"></nav>

   <dialog class="popup">
      <h2 class="title_popup">Configurações:</h2>
      <div class="config_grid">
         <p class="config_text">Modo claro:</p>
         <button class="light_button" aria-label="Alternar modo escuro">
            <ion-icon name="sunny-outline"></ion-icon>
         </button>
      </div>
      <button class="fechar_popup">Fechar</button>
   </dialog>

   <main id="main">
      <button class="searchbar" onclick="alert('Você clicou no botão!')">
         <h1 class="search_title">
            Pesquisar...
         </h1>

         <h1 class="search_icon">
            🔍
         </h1>
      </button>


      <section id="section"></section>


      <button class="seemore_button" onclick="alert('Você clicou no botão!')">
         Ver mais
      </button>
   </main>


   <footer id="footer"></footer>

   
   <script type="module" src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.esm.js"></script>
   <script nomodule src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.js"></script>

   <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
   
   <script src="scriptpokemon.js"></script>
   <script type="module" src="script.js"></script>
</body>
 
</html>
