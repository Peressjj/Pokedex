<!DOCTYPE html>
<html lang="pt-br" class="light">

<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Perfil</title>
   <link rel="stylesheet" href="../../style.css">
   <link rel="stylesheet" href="perfil.css">
</head>

<body>

   <header id="header"></header>

   <dialog class="popup"></dialog>

   <main id="main">

      <div class="perfil_card">
         <div class="perfil_info">
            <div class="avatar">
               <div class="avatar_circulo">
                  <ion-icon name="logo-octocat"></ion-icon>
               </div>
               <button class="botao_camera" title="Alterar foto">
                  <ion-icon name="camera-outline"></ion-icon>
               </button>
            </div>

            <div class="perfil_detalhes">
               <h2 class="nome_perfil">João Vitor</h2>
               <span class="usuario_perfil">@jvperes</span>
               <p class="bio_perfil">Explorando o mundo Pokémon, um dia de cada vez.</p>
               <div class="meta_perfil">
                  <span class="meta_item"><ion-icon name="location-outline"></ion-icon> Brasil</span>
                  <span class="meta_item"><ion-icon name="calendar-outline"></ion-icon> Membro desde ago. 2025</span>
               </div>
            </div>
         </div>

         <div class="perfil_lateral">
            <blockquote class="citacao">
               "Pokémon não são apenas criaturas, mas histórias que nos acompanham."
            </blockquote>
            <button class="botao_editar">
               <ion-icon name="create-outline"></ion-icon> Editar perfil
            </button>
         </div>
      </div>

      <div class="grid_triplo">
         <div class="quadrado">
            <div class="icone_stat roxo">
               <ion-icon name="radio-button-on"></ion-icon>
            </div>
            <div class="info_stat">
               <span class="numero_stat" id="stat_vistos">124</span>
               <span class="texto_stat">Pokémon vistos</span>
            </div>
         </div>

         <div class="quadrado">
            <div class="icone_stat rosa">
               <ion-icon name="heart"></ion-icon>
            </div>
            <div class="info_stat">
               <span class="numero_stat" id="stat_favoritos">8</span>
               <span class="texto_stat">Favoritos</span>
            </div>
         </div>

         <div class="quadrado">
            <div class="icone_stat azul">
               <ion-icon name="git-compare-outline"></ion-icon>
            </div>
            <div class="info_stat">
               <span class="numero_stat">3</span>
               <span class="texto_stat">Comparações</span>
            </div>
         </div>
      </div>


      <div class="favoritos">
         <div class="favoritos_header">
            <h2 class="title_favoritos">Meus Pokémon favoritos:</h2>
            <a href="../favoritos/favoritos.html" class="ver_todos">Ver todos <ion-icon name="arrow-forward-outline"></ion-icon></a>
         </div>

         <div class="grid_pokemons">

            

         </div>
      </div>

   </main>

   <footer id="footer"></footer>

   <script type="module" src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.esm.js"></script>
   <script nomodule src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.js"></script>

   <script src="../../script.js"></script>
   <script src="perfil.js"></script>
</body>

</html>
