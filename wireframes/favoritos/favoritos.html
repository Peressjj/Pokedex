<!DOCTYPE html>
<html lang="pt-br" class="light">

<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Favoritos</title>
   <link rel="stylesheet" href="favoritos.css">
   <link rel="stylesheet" href="../../style.css">
</head>

<body>

   <header id="header"></header>

   <nav id="navbar"></nav>



   <main id="main">
      <button class="searchbar" onclick="alert('Você clicou no botão!')">
         <h1 class="search_title">
            Pesquisar...
         </h1>
   
         <h1 class="search_icon">
            🔍
         </h1>
      </button>
   
      <!--SECTION-->
      <section id="section">
         <!--Cartas-->
         <article class="card">
            <div class="card_header">
               <p class="card_id">ID: TESTE</p>
               <button class="sword_button" aria-label="Comparar pokémon">
                  ⚔️
               </button>
               <button class="hearth_button" aria-label="Favoritar pokémon">
                  <ion-icon name="heart-outline"></ion-icon>
               </button>
            </div>
            <div class="card_main">
               <img
                  src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/shiny/4.png"
                  alt="charmander" class="card_img">
            </div>
            <div class="card_footer">
               <p class="card_title">Name: TESTE</p>
            </div>
         </article>
      </section>

      <button class="seemore_button" onclick="alert('Você clicou no botão!')">
         Ver mais
      </button>
   </main>



   <footer id="footer"></footer>


   <script type="module" src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.esm.js"></script>
   <script nomodule src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.js"></script>

   <script type="module" src="favoritos.js"></script>
   <script type="module" src="../../script.js"></script>
</body>

</html>
